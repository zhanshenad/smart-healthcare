# BYOK 模型白名单：前端只能传 id，baseUrl/modelName 由服务端固定
xiaozhi:
  models:
    default-model-id: qwen4-max
    entries:
      # 百炼，有服务端默认 Key
      - id: qwen4-max
        provider: dashscope
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        model-name: qwen4-max
      # DeepSeek 官方
      - id: deepseek-flash
        provider: deepseek
        base-url: https://api.deepseek.com/v1
        model-name: deepseek-flash
      # 智谱 GLM，glm-4-flash 免费
      - id: glm-4-flash
        provider: zhipu
        base-url: https://open.bigmodel.cn/api/paas/v4
        model-name: glm-4-flash
      # 硅基流动，Qwen3-8B 免费
      - id: Qwen/Qwen3-8B
        provider: siliconflow
        base-url: https://api.siliconflow.cn/v1
        model-name: Qwen/Qwen3-8B
      # Moonshot Kimi
      - id: moonshot-v1-128k
        provider: moonshot
        base-url: https://api.moonshot.cn/v1
        model-name: moonshot-v1-128k
      # PPIO 派欧云，模型 ID 带厂商前缀
      - id: deepseek/deepseek-v3.2
        provider: ppio
        base-url: https://api.ppio.com/openai/v1
        model-name: deepseek/deepseek-v3.2
    # 未配置用户 Key 时回退到服务端默认 Key
    default-api-keys:
      dashscope: "${DASH_SCOPE_API_KEY:}"
