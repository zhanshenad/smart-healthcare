#web服务的端口号
server.port=8080

#知识库文档上传大小限制
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

langchain4j.open-ai.chat-model.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
langchain4j.open-ai.chat-model.api-key=${DASH_SCOPE_API_KEY}
langchain4j.open-ai.chat-model.model-name=qwen4-max

#默认不打印模型请求和响应，避免用户消息里的敏感信息进入日志
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false

langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=deepseek-r1:1.5b
langchain4j.ollama.chat-model.temperature=0.8
langchain4j.ollama.chat-model.timeout=PT60S

#应用程序发送给大模型的请求日志和响应日志
langchain4j.ollama.chat-model.log-requests=true
langchain4j.ollama.chat-model.log-responses=true

#阿里百炼平台
langchain4j.community.dashscope.chat-model.api-key=${DASH_SCOPE_API_KEY}
langchain4j.community.dashscope.chat-model.model-name=qwen4-max

#集成阿里通义千问-文本向量（百炼免费额度）
langchain4j.community.dashscope.embedding-model.api-key=${DASH_SCOPE_API_KEY}
langchain4j.community.dashscope.embedding-model.model-name=qwen3.7-text-embedding-flash

#RAG配置：qwen3.7-text-embedding-flash 固定 1024 维，切片 500 字符、重叠 80
xiaozhi.rag.embedding-dimension=1024
xiaozhi.rag.chunk-size=500
xiaozhi.rag.chunk-overlap=80

#混合检索：Dense/BM25 各取 50 条，RRF 融合后最多 30 条，Rerank 后取 5 条
xiaozhi.rag.candidate-k=50
xiaozhi.rag.rrf-k=60
xiaozhi.rag.rerank-candidate-k=30
xiaozhi.rag.top-n=5

#Rerank 使用百炼 qwen3.7-text-rerank，未配置 Key 时自动跳过并回退到 RRF 排序
xiaozhi.rag.rerank.enabled=true
xiaozhi.rag.rerank.url=https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
xiaozhi.rag.rerank.model=qwen3.7-text-rerank
xiaozhi.rag.rerank.api-key=${DASH_SCOPE_API_KEY:}
xiaozhi.rag.rerank.timeout-seconds=10

#Boost 加分：科室精确匹配、标题匹配、官方/指南类文档
xiaozhi.rag.boost.department-weight=0.05
xiaozhi.rag.boost.title-weight=0.03
xiaozhi.rag.boost.official-weight=0.02

#MinerU 解析：默认关闭，复杂/扫描 PDF 可开启
xiaozhi.rag.mineru.enabled=${MINERU_ENABLED:false}
xiaozhi.rag.mineru.url=${MINERU_URL:http://localhost:8000}
xiaozhi.rag.mineru.backend=${MINERU_BACKEND:pipeline}
xiaozhi.rag.mineru.server-url=${MINERU_SERVER_URL:}
xiaozhi.rag.mineru.lang=${MINERU_LANG:ch}
xiaozhi.rag.mineru.timeout-seconds=300

#Milvus向量库配置（本地Docker，使用本地存储，不依赖MinIO）
xiaozhi.rag.milvus.host=localhost
xiaozhi.rag.milvus.port=19530
xiaozhi.rag.milvus.database-name=default
xiaozhi.rag.milvus.collection-name=smart_healthcare_chunks

#MongoDB连接配置
spring.data.mongodb.uri=mongodb://localhost:27018/chat_memory_db

#对话记忆窗口配置（qwen-plus 当前支持 1M 上下文，这里留出输出和摘要余量）
xiaozhi.memory.max-tokens=200000
xiaozhi.memory.keep-recent-turns=8
xiaozhi.memory.summary-enabled=true

#JWT配置，生产环境必须通过环境变量覆盖 JWT_SECRET
app.jwt.secret=${JWT_SECRET:smart-healthcare-dev-secret-change-me-2026}
app.jwt.access-token-ttl-minutes=30
app.jwt.refresh-token-ttl-days=7

#短信验证码配置，当前未接真实短信服务，验证码会打印在后端日志
app.sms.code-ttl-minutes=5
app.sms.send-interval-seconds=60
app.sms.max-verify-attempts=5
app.sms.max-daily-sends=20
app.sms.debug=true

# 基本数据源配置（Docker MySQL 映射到 3307，避免与本机 3306 冲突）
spring.datasource.url=jdbc:mysql://localhost:3307/guiguxiaozhi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# SQL 日志走 SLF4J，默认 info 不打印参数；调试时把 mapper 包设为 debug
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

#将系统日志设置为debug级别
logging.level.root=info

#模型白名单拆到 models.yml，增加模型只改这个文件
spring.config.import=classpath:models.yml

#用户 API Key 加密主密钥，Base64 编码的 32 字节；未配置时禁用保存功能
app.model-key-secret=${MODEL_KEY_SECRET:}